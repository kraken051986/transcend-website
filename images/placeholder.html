<!DOCTYPE html>
<html>
<head>
    <title>Image Placeholder Generator</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .placeholder { 
            width: 400px; 
            height: 300px; 
            background: linear-gradient(45deg, #1a365d, #2c5282);
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 24px;
            font-weight: bold;
            margin: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h2>Right-click and save these placeholders:</h2>
    
    <div class="placeholder">Auditing Services</div>
    <div class="placeholder">Accounting Services</div>
    <div class="placeholder">Tax Consultancy</div>
    <div class="placeholder">Business Setup</div>
    
    <!-- Add more placeholders as needed -->
</body>
</html>
